[project]
name = "pi-attn-vllm027-comparison"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.27.0",
    "torch==2.13.0+cu130",
    "numpy>=2,<3",
    "ninja",
    "packaging",
    "setuptools>=77,<81",
]

[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project.entry-points."vllm.general_plugins"]
pi_attn = "pi_attn_vllm:register"

[tool.setuptools.packages.find]
include = ["pi_attn_vllm*"]

# An independent workspace: vLLM's dependencies must not change the Rust profile.
[tool.uv.workspace]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
