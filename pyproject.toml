[project]
name = "pi-attn"
version = "0.1.0"
description = "Single-GPU deterministic inference and kernel validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0+cu130; sys_platform == 'linux'",
    "numpy>=2,<3",
    "ninja>=1.11",
    "packaging",
    "setuptools",
]

[project.optional-dependencies]
cuda = ["flashinfer-python[cu13]==0.6.18; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "openai>=1,<3",
    "requests>=2.34.2",
    "transformers==5.20.2",
    "safetensors>=0.8,<1",
    "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["llm_infer_rust"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
